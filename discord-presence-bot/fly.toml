# Déploiement gratuit sur Fly.io (allocation gratuite : 3 machines
# shared-cpu-1x 256 MB). Le bot doit rester connecté au gateway en continu :
# auto_stop_machines = false empêche Fly de mettre la machine en veille.
app = "astra-presence"

primary_region = "fra"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
